# Checkov configuration for non-production environments (dev, staging).
# Mirrors .checkov.yaml plus the three checks that are prod-only baselines.
# Keep the skip lists in sync with .checkov.yaml when adding/removing entries.

compact: false

skip-check:
  # ── Language-version checks – not applicable for container deployments ──────
  - CKV_AZURE_80   # PHP version: managed by the container image
  - CKV_AZURE_81   # Python version: same rationale
  - CKV_AZURE_82   # Java version: same rationale
  - CKV_AZURE_84   # .NET version: same rationale

  # ── Azure Files storage – not applicable for stateless containers ───────────
  - CKV_AZURE_88   # Ensure App Service uses Azure Files

  # ── Application-layer concerns, not owned by this infrastructure template ───
  - CKV_AZURE_17   # Client certificates (mTLS): inbound traffic arrives through the Private
                   # Endpoint from inside the VNet (staging/prod) or from GitHub-hosted
                   # runners during dev smoke tests. Neither path presents a client
                   # certificate, so requiring one would fail all legitimate ingress.

  # ── Prod-only baselines, skipped for dev/staging ────────────────────────────
  - CKV_AZURE_12   # Flow-log retention ≥ 90 days: retention is environment-driven
                   # (30/60/90); the 90-day floor is a prod compliance baseline,
                   # which prod meets natively.
  - CKV_AZURE_212  # Minimum instances for failover: dev/staging start at 1
  - CKV_AZURE_222  # Public network access disabled: dev keeps public open for
                   # HTTP smoke tests from GitHub-hosted runners; prod is PE-only.
  - CKV_AZURE_225  # App Service Plan zone redundancy: only prod is zone-redundant
  - CKV_AZURE_42   # Key Vault recoverable (soft delete + purge protection): non-prod
                   # vaults keep soft delete but stay purgeable so a torn-down stack
                   # can be recreated without a 90-day name reservation; prod enables it.
  - CKV_AZURE_110  # Key Vault purge protection: same rationale as CKV_AZURE_42
